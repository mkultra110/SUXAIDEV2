name: Build & deploy desktop installers

# Full pipeline:
#   1. Build the Electron installers on Windows/macOS/Linux runners.
#   2. On pushes to the dev branch (or tags), SCP the Windows installer
#      to the VPS at /opt/suxai/releases/, update /opt/suxai/.env with the
#      new UPDATE_VERSION/URL/SHA256/SIZE, and restart suxai-server. The
#      IDE auto-update checker then sees the new version on next launch
#      (or within an hour for long-running sessions).
#
# Required GitHub repo secrets (set once, under repo Settings → Secrets):
#   VPS_HOST      — e.g. 209.99.186.238
#   VPS_USER      — e.g. root
#   VPS_SSH_KEY   — the PRIVATE SSH key authorised on the VPS
#                   (generated by server/deploy/setup-github-deploy.sh)
#   VPS_PUBLIC_URL_BASE — e.g. https://suxai.209-99-186-238.sslip.io
#
# See server/deploy/setup-github-deploy.sh for one-shot VPS setup.

on:
  push:
    branches:
      - claude/french-greeting-lGwbV
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: win,mac,linux)"
        required: false
        default: "win"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: SUXAI-Windows
            pattern: release/*.exe
            ext: exe
          - os: macos-latest
            platform: mac
            artifact: SUXAI-macOS
            pattern: release/*.dmg
            ext: dmg
          - os: ubuntu-latest
            platform: linux
            artifact: SUXAI-Linux
            pattern: release/*.AppImage
            ext: AppImage
    runs-on: ${{ matrix.os }}
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, matrix.platform)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.platform }} installer
        run: npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    # Only the Windows build is published to the VPS auto-updater for now.
    # (macOS/Linux builds are still produced as artifacts in the `build`
    # job above so they can be downloaded from the Actions tab.)
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/claude/french-greeting-lGwbV' ||
       startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SUXAI-Windows
          path: windows-installer

      - name: Resolve installer filename + checksum + size
        id: file
        run: |
          FILE=$(ls windows-installer/*.exe | head -n1)
          NAME=$(basename "$FILE")
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          SIZE=$(stat -c %s "$FILE")
          echo "file=$FILE"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"    >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload installer to VPS
        run: |
          scp -i ~/.ssh/id_deploy \
              "${{ steps.file.outputs.file }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/suxai/releases/${{ steps.file.outputs.name }}"

      - name: Update /opt/suxai/.env + restart service
        run: |
          URL="${{ secrets.VPS_PUBLIC_URL_BASE }}/releases/${{ steps.file.outputs.name }}"
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "bash -s" << EOF
          set -euo pipefail
          ENV=/opt/suxai/.env
          sudo sed -i "s|^UPDATE_VERSION=.*|UPDATE_VERSION=${{ steps.meta.outputs.version }}|" \$ENV
          sudo sed -i "s|^UPDATE_URL=.*|UPDATE_URL=${URL}|"                                  \$ENV
          sudo sed -i "s|^UPDATE_SHA256=.*|UPDATE_SHA256=${{ steps.file.outputs.sha }}|"       \$ENV
          sudo sed -i "s|^UPDATE_SIZE=.*|UPDATE_SIZE=${{ steps.file.outputs.size }}|"           \$ENV
          sudo chown suxai:suxai /opt/suxai/releases/${{ steps.file.outputs.name }}
          sudo chmod 0644         /opt/suxai/releases/${{ steps.file.outputs.name }}
          sudo systemctl restart suxai-server
          echo "Deployed ${{ steps.meta.outputs.version }}"
          EOF

      - name: Verify manifest
        run: |
          sleep 3
          curl -sfL "${{ secrets.VPS_PUBLIC_URL_BASE }}/update/manifest" | tee manifest.json
          grep -q "${{ steps.meta.outputs.version }}" manifest.json
