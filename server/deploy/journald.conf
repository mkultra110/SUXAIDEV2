#
# /etc/systemd/journald.conf.d/suxai-cap.conf — limite les journaux systemd
#
# Sans cap, /var/log/journal/ peut accumuler plusieurs GB de logs
# binaires et saturer le disque. On a vu en prod (2026-05-01) ~1.6GB
# de fichiers .journal qui ont contribué à un disk-full + restart loop.
#
# SystemMaxUse=500M  — disque utilisé pour les journaux persistants
# SystemKeepFree=1G  — garde toujours 1GB libre sur la partition
# RuntimeMaxUse=200M — cap pour /run/log/journal (volatile)
# MaxRetentionSec    — purge automatique au-delà de 14 jours
#
# Installé par server/deploy/install.sh dans
# /etc/systemd/journald.conf.d/suxai-cap.conf — un drop-in qui n'écrase
# pas la config principale.

[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
RuntimeMaxUse=200M
MaxRetentionSec=2week
