name: Build & deploy desktop installers

# Windows-only for now to keep the smoke test simple. macOS/Linux can be
# re-added later — the pipeline structure is the same.
#
# Flow:
#   1. Build the Windows NSIS installer on a windows-latest runner.
#   2. SCP the installer to /opt/suxai/releases/ on the VPS.
#   3. Rewrite UPDATE_VERSION/URL/SHA256/SIZE in /opt/suxai/.env.
#   4. Restart suxai-server.
#   5. Verify /update/manifest returns the new version.
#
# Required GitHub repo secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PUBLIC_URL_BASE

on:
  push:
    branches:
      - claude/french-greeting-lGwbV
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build output
        shell: bash
        run: ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: SUXAI-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build-windows
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/claude/french-greeting-lGwbV' ||
       startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SUXAI-Windows
          path: windows-installer

      - name: Resolve installer metadata
        id: file
        run: |
          FILE=$(ls windows-installer/*.exe | head -n1)
          NAME=$(basename "$FILE")
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          SIZE=$(stat -c %s "$FILE")
          echo "file=$FILE"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"    >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"
          echo "Resolved: $NAME  size=$SIZE  sha=$SHA"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload installer to VPS
        run: |
          scp -i ~/.ssh/id_deploy \
              "${{ steps.file.outputs.file }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/suxai/releases/${{ steps.file.outputs.name }}"

      - name: Update /opt/suxai/.env and restart suxai-server
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NAME:    ${{ steps.file.outputs.name }}
          SHA:     ${{ steps.file.outputs.sha }}
          SIZE:    ${{ steps.file.outputs.size }}
          URL_BASE: ${{ secrets.VPS_PUBLIC_URL_BASE }}
          SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          URL="${URL_BASE}/releases/${NAME}"
          ssh -i ~/.ssh/id_deploy "$SSH_TARGET" "bash -s" <<EOF
          set -euo pipefail
          ENV_FILE=/opt/suxai/.env
          sed -i "s|^UPDATE_VERSION=.*|UPDATE_VERSION=${VERSION}|" "\$ENV_FILE"
          sed -i "s|^UPDATE_URL=.*|UPDATE_URL=${URL}|"             "\$ENV_FILE"
          sed -i "s|^UPDATE_SHA256=.*|UPDATE_SHA256=${SHA}|"       "\$ENV_FILE"
          sed -i "s|^UPDATE_SIZE=.*|UPDATE_SIZE=${SIZE}|"          "\$ENV_FILE"
          chown suxai:suxai "/opt/suxai/releases/${NAME}"
          chmod 0644        "/opt/suxai/releases/${NAME}"
          systemctl restart suxai-server
          echo "Deployed ${VERSION}"
          EOF

      - name: Verify manifest
        env:
          URL_BASE: ${{ secrets.VPS_PUBLIC_URL_BASE }}
          VERSION:  ${{ steps.meta.outputs.version }}
        run: |
          sleep 3
          BODY=$(curl -sfL "${URL_BASE}/update/manifest")
          echo "$BODY"
          echo "$BODY" | grep -q "\"version\":\"${VERSION}\""
