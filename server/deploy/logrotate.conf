#
# /etc/logrotate.d/suxai-server — auto-rotate SUXAI server logs
#
# Sans ça, server.log grossit indéfiniment (le service systemd écrit en
# append:/opt/suxai/logs/server.log) et finit par saturer le disque,
# empêchant tout redémarrage du service (Failed to run 'start' task:
# No space left on device — incident prod 2026-05-01).
#
# Rotation : daily, 14 archives compressées, taille max 50M.
# copytruncate parce que le service écrit via systemd en append et ne
# rouvre pas son fd sur SIGHUP. copytruncate copie le fichier puis
# truncate le original — pas de signal nécessaire.
#
# Installé par server/deploy/install.sh.

/opt/suxai/logs/*.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su suxai suxai
    create 0640 suxai suxai
}
